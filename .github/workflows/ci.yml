name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # CI never has secrets or network to data providers: run fully offline.
      ETF_INTEL_MARKET_SOURCE: synthetic
      ETF_INTEL_MACRO_SOURCE: synthetic
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy type check
        run: uv run mypy

      - name: Import-linter architecture contracts
        run: uv run lint-imports

      - name: Pytest (incl. leakage test)
        run: uv run pytest --cov=etf_intel --cov-report=term-missing

      - name: Smoke-test full pipeline (offline)
        run: |
          uv run python scripts/run_ingest.py --source synthetic
          uv run python scripts/run_train.py
          uv run python scripts/run_backtest.py
          uv run python scripts/run_report.py
