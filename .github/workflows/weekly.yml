# ─────────────────────────────────────────────────────────────────────────────
# ETF Intel — Weekly ranking + email/Telegram digest (runs in the CLOUD)
#
# Runs every Monday 07:00 UTC on GitHub's servers, so your laptop can be OFF.
# Also runnable on demand: GitHub → Actions → "ETF Intel Weekly" → Run workflow.
#
# Setup (one time):
#   1. Push this repo to GitHub.
#   2. repo → Settings → Secrets and variables → Actions → add these secrets:
#        ETF_INTEL_FRED_API_KEY, ETF_INTEL_RESEND_API_KEY, ETF_INTEL_REPORT_RECIPIENT,
#        ETF_INTEL_TELEGRAM_BOT_TOKEN, ETF_INTEL_TELEGRAM_CHAT_ID
#   Secrets are encrypted and never appear in the repo.
# ─────────────────────────────────────────────────────────────────────────────
name: ETF Intel Weekly

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch: {}

concurrency:
  group: etf-intel-weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ETF_INTEL_MARKET_SOURCE: yfinance
      ETF_INTEL_MACRO_SOURCE: fred
      ETF_INTEL_FRED_API_KEY: ${{ secrets.ETF_INTEL_FRED_API_KEY }}
      ETF_INTEL_RESEND_API_KEY: ${{ secrets.ETF_INTEL_RESEND_API_KEY }}
      ETF_INTEL_REPORT_RECIPIENT: ${{ secrets.ETF_INTEL_REPORT_RECIPIENT }}
      ETF_INTEL_TELEGRAM_BOT_TOKEN: ${{ secrets.ETF_INTEL_TELEGRAM_BOT_TOKEN }}
      ETF_INTEL_TELEGRAM_CHAT_ID: ${{ secrets.ETF_INTEL_TELEGRAM_CHAT_ID }}
      # Optional: publish a compact summary to a gist for the on-demand bot.
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      GIST_ID: ${{ secrets.GIST_ID }}
      # Cross-repo token to fetch SPAI's latest Gold PDF for the combined report.
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies (+ report extra for the PDF)
        run: |
          uv sync --extra report
          uv run playwright install --with-deps chromium

      - name: Ingest → train → backtest → report → stress
        run: |
          uv run python scripts/run_ingest.py
          uv run python scripts/run_train.py
          uv run python scripts/run_backtest.py
          uv run python scripts/run_report.py
          uv run python scripts/run_stress.py

      - name: Send weekly digest email (Telegram handled by the combined PDF)
        run: uv run python scripts/run_digest.py --no-telegram

      - name: Download SPAI's latest Gold PDF (from the SPAI repo release)
        if: env.GH_PAT != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p data/spai
          gh release download weekly-latest --repo peymankhp/SPAI \
            --pattern "*.pdf" --dir data/spai --clobber || echo "no SPAI release yet"

      - name: Send combined ETF + Gold PDF to Telegram
        run: |
          uv run python scripts/send_combined_pdf.py --spai-pdf data/spai/spai_report.pdf

      - name: Publish summary to gist (for the on-demand bot)
        if: env.GIST_TOKEN != '' && env.GIST_ID != ''
        run: |
          uv run python scripts/build_summary.py
          uv run python - <<'PY'
          import json, os, urllib.request
          content = open("data/reports/summary.json", encoding="utf-8").read()
          payload = json.dumps({"files": {"summary.json": {"content": content}}}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/gists/{os.environ['GIST_ID']}",
              data=payload, method="PATCH",
              headers={"Authorization": f"token {os.environ['GIST_TOKEN']}",
                       "Accept": "application/vnd.github+json"})
          urllib.request.urlopen(req).read()
          print("gist updated")
          PY

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-reports-${{ github.run_number }}
          path: data/reports/
          retention-days: 90
