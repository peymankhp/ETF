# Non-secret configuration. Secrets live in .env (see .env.example).
# Everything here is versioned so runs are reproducible.

seed: 42

data:
  root: ./data                # parquet snapshots + duckdb file live under here
  duckdb_file: etf_intel.duckdb
  start_date: "2010-01-01"    # ingestion history start
  # end_date left null -> "today" at ingest time (recorded in snapshot metadata)
  min_history_days: 252       # drop tickers with < ~1y of history at ingest

universe_file: ./config/universe_v1.yaml   # v1: ~115 ETFs (was universe.yaml, 20)

# Forward-return label horizons in trading days (~21 td/month).
horizons:
  fwd_1w: 5
  fwd_1m: 21
  fwd_3m: 63

# Primary target the model optimises.
# fwd_3m chosen after a feature-IC scan: cross-sectional signal (momentum/trend/
# vol factors) is ~2x stronger at 3 months than at 1 month.
target:
  horizon: fwd_3m             # which horizon to model
  kind: excess_vs_benchmark   # excess return over the benchmark (SPY)

features:
  return_windows: [5, 21, 63, 126, 252]
  vol_windows: [21, 63]
  ma_windows: [50, 200]
  rsi_window: 14
  macd: { fast: 12, slow: 26, signal: 9 }
  drawdown_window: 252
  rel_strength_window: 63     # relative strength vs benchmark
  include_macro: false        # macro is constant per-date -> no cross-sectional value
  macro_release_lag_days:     # conservative publication lag per FRED series (Decision B)
    DGS10: 1
    DGS2: 1
    T10Y2Y: 1
    CPIAUCSL: 30
    UNRATE: 15
    FEDFUNDS: 5

macro_series:                 # FRED series ids -> friendly names
  DGS10: treasury_10y
  DGS2: treasury_2y
  T10Y2Y: yield_curve_10y2y
  CPIAUCSL: cpi
  UNRATE: unemployment
  FEDFUNDS: fed_funds_rate

model:
  kind: ensemble              # lightgbm | xgboost | ensemble (LightGBM + XGBoost avg)
  params:
    objective: regression
    n_estimators: 300
    learning_rate: 0.03
    num_leaves: 31
    max_depth: -1
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    random_state: 42
    n_jobs: 1
    verbose: -1

backtest:
  # Empirically monthly beats quarterly NET (14.1% vs 12.5% CAGR): monthly signal
  # refresh adds ~2.6% gross alpha, more than the ~1%/yr extra turnover cost.
  rebalance: monthly          # monthly | quarterly
  train_min_days: 504         # ~2y minimum before first prediction
  embargo_days: 63            # >= label horizon (now 3m); purge+embargo (Decision D)
  top_bucket_only: true       # equity curve = top bucket long-only
  retrain_every_months: 3     # predict monthly, retrain quarterly (walk-forward)

# Portfolio construction for the long book (v1.4).
# scheme=equal chosen empirically: this signal rewards high volatility, so
# inverse_vol/hrp (which tilt toward low vol) underperform equal-weight here.
portfolio:
  scheme: equal               # equal | inverse_vol
  max_weight: 0.15            # cap per position; excess redistributed
  cost_bps: 10                # round-trip transaction cost per unit turnover (bps)
  vol_lookback: 63            # trailing days for vol / covariance estimation

# Cross-sectional rating buckets, from best predicted score to worst.
# Fractions must sum to 1.0. Ordered best -> worst.
ratings:
  strong_buy: 0.10
  buy: 0.20
  hold: 0.40
  reduce: 0.15
  sell: 0.10
  strong_sell: 0.05
